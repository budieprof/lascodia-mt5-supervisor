[project]
name = "lascodia-mt5-supervisor"
version = "0.1.0"
description = "Sidecar daemon for the Lascodia Trading Engine — supervises MT5 terminal lifecycles per broker account."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "pydantic>=2.0",
]

[project.scripts]
lascodia-supervisor = "lascodia_supervisor.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lascodia_supervisor*"]
