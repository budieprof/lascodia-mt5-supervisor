# Lascodia MT5 Supervisor — example config.
#
# Copy this file to ~/.lascodia/supervisor.yaml and edit.
# Or pass a custom path via LASCODIA_SUPERVISOR_CONFIG=/path/to/file.yaml.

# Globally-unique identifier for this daemon — used by the engine to
# distinguish multiple supervisors (e.g. one per VPS).
daemon_id: "macbook-pro-wine-dev"

name: "Mac Wine (dev)"

# Where the daemon's own HTTP server binds.
bind_host: "127.0.0.1"
bind_port: 7770

# URL the engine will call back into for /terminals/launch etc.
# For local dev this matches bind_host:bind_port.  For cross-host setups
# (engine on container, daemon on Wine host) point this at the daemon's
# reachable address.
callback_base_url: "http://127.0.0.1:7770"

# Engine API root.
engine_url: "http://localhost:5081/api/v1/lascodia-trading-engine"

# Long-lived JWT the operator generated for this daemon.  Same shape
# the EAs use — get one by hitting POST /auth/token with the Admin
# role.  Keep it secret.
engine_token: "REPLACE_WITH_OPERATOR_PROVISIONED_JWT"

# 32+ chars of randomness — engine uses this as X-Daemon-Auth on every
# call back into the daemon.  Re-registration overwrites engine-side.
# Generate with:  python -c "import secrets; print(secrets.token_urlsafe(32))"
daemon_api_key: "REPLACE_WITH_32_RANDOM_CHARS"

# ── Machine credentials (engine multi-tenancy Phase 5) ──────────────────
# Single-use Daemon enrollment token from the console ("Connect a supervisor"),
# lsc_enr_<8>_<40>, valid 24 h.  Used ONCE, only while no machine credential is
# stored: the daemon exchanges it for its own credential (kept in credential_path,
# mode 0600) and signs in with that from then on.  An enrolled daemon also hands
# every terminal it launches an EA enrollment token bound to the install's
# account, so the EA enrolls itself.  Leave empty to keep signing in with
# daemon_api_key (only while the engine still allows daemon-key sign-in).
enrollment_token: ""
# Where the credential is kept.  Default: machine_credential.json next to this file.
# credential_path: "/Users/you/.lascodia/machine_credential.json"

heartbeat_interval_sec: 30

# Each install entry maps an operator-assigned slug to a launch command.
# The supervisor doesn't manage broker credentials — those live inside
# each MT5 install's saved-login state.  Per install: configure MT5
# once manually with its broker login and "Save account info" enabled,
# then point install.executable at terminal64.exe.
installs:
  # ── Example: macOS Wine install with the MetaQuotes demo account ──
  - install_id: "demo-metaquotes"
    name: "MetaQuotes Demo (Wine)"
    executable: "/Users/you/Library/Application Support/net.metaquotes.wine.metatrader5/drive_c/Program Files/MetaTrader 5/terminal64.exe"
    use_wine: true                     # macOS / Linux — prepend `wine`
    extra_args: []                     # e.g. ["/portable"] to force a portable install
    broker_name: "MetaQuotes-Demo"     # the broker SERVER the account signs in to
    account_login: "5049397557"
    # Where the daemon drops the EA enrollment token before a launch
    # (<mql5_dir>/Files/Lascodia/enrollment_token.txt).  Default: the MQL5
    # folder next to terminal64.exe.
    # mql5_dir: "/Users/you/Library/Application Support/net.metaquotes.wine.metatrader5/drive_c/Program Files/MetaTrader 5/MQL5"

  # ── Example: native Windows VPS install with a real broker account ──
  # - install_id: "ic-markets-prod"
  #   name: "IC Markets Production"
  #   executable: "C:\\Program Files\\MetaTrader 5 IC Markets\\terminal64.exe"
  #   use_wine: false
  #   extra_args: ["/portable"]
  #   broker_name: "ICMarketsSC-Live"
  #   account_login: "12345678"
